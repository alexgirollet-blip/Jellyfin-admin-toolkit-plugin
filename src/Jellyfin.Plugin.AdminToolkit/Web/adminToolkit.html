<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin Toolkit</title>
</head>
<body>
<div id="AdminToolkitPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
    <style>
        #AdminToolkitPage .at-wrap { max-width: 96em; margin: 0 auto; padding: 0 .2em 3em; }
        #AdminToolkitPage h2 { margin: .2em 0 .4em; }
        #AdminToolkitPage h3 { margin: .2em 0 .5em; font-size: 1.1em; }
        #AdminToolkitPage h4 { margin: .6em 0 .3em; font-size: 1em; }
        #AdminToolkitPage .at-status { display: flex; flex-wrap: wrap; gap: .4em .8em; align-items: center; font-size: .9em; margin: 0 0 .8em; }
        #AdminToolkitPage .at-tabs { display: flex; flex-wrap: wrap; gap: .3em; margin: 0 0 1em; border-bottom: 1px solid rgba(128,128,128,.35); padding-bottom: .4em; }
        #AdminToolkitPage .at-tabs button { min-height: 40px; padding: .4em .9em; border-radius: .4em; border: 1px solid rgba(128,128,128,.35); background: rgba(128,128,128,.08); color: inherit; cursor: pointer; font: inherit; }
        #AdminToolkitPage .at-tabs button[aria-selected="true"] { background: rgba(0,164,220,.25); border-color: rgba(0,164,220,.8); font-weight: 600; }
        #AdminToolkitPage .at-card { border: 1px solid rgba(128,128,128,.35); border-radius: .6em; padding: .8em 1em; margin: 0 0 1em; background: rgba(128,128,128,.07); min-width: 0; }
        #AdminToolkitPage .at-row { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; margin: .4em 0; }
        #AdminToolkitPage .at-row > * { margin: 0; }
        #AdminToolkitPage .at-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19em), 1fr)); gap: .8em; }
        #AdminToolkitPage .at-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20em), 1fr)); gap: .2em 1.5em; }
        #AdminToolkitPage .at-field { display: flex; flex-direction: column; gap: .25em; margin: .45em 0; }
        #AdminToolkitPage .at-field > span { font-size: .9em; opacity: .85; }
        #AdminToolkitPage input[type=text], #AdminToolkitPage input[type=number], #AdminToolkitPage input[type=password], #AdminToolkitPage input[type=url], #AdminToolkitPage input[type=search], #AdminToolkitPage select, #AdminToolkitPage textarea {
            font: inherit; color: inherit; background: rgba(128,128,128,.12); border: 1px solid rgba(128,128,128,.45); border-radius: .35em; padding: .45em .6em; min-height: 38px; box-sizing: border-box; max-width: 100%; }
        #AdminToolkitPage select option { color: #111; background: #fff; }
        #AdminToolkitPage label.at-check { display: flex; gap: .5em; align-items: flex-start; min-height: 34px; cursor: pointer; }
        #AdminToolkitPage label.at-check input { width: 1.2em; height: 1.2em; margin-top: .15em; flex: none; }
        #AdminToolkitPage .at-btn { font: inherit; color: inherit; min-height: 38px; padding: .35em .9em; border-radius: .35em; border: 1px solid rgba(128,128,128,.5); background: rgba(128,128,128,.15); cursor: pointer; }
        #AdminToolkitPage .at-btn:hover { background: rgba(128,128,128,.28); }
        #AdminToolkitPage .at-btn[disabled] { opacity: .45; cursor: not-allowed; }
        #AdminToolkitPage .at-btn.at-primary { background: rgba(0,164,220,.85); border-color: rgba(0,164,220,1); color: #fff; }
        #AdminToolkitPage .at-btn.at-danger { background: rgba(204,51,51,.85); border-color: rgba(204,51,51,1); color: #fff; }
        #AdminToolkitPage .at-btn.at-small { min-height: 30px; padding: .15em .6em; font-size: .9em; }
        #AdminToolkitPage .at-muted { opacity: .72; font-size: .9em; }
        #AdminToolkitPage .at-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; word-break: break-all; }
        #AdminToolkitPage .at-badge { display: inline-block; padding: .1em .5em; border-radius: 1em; font-size: .8em; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
        #AdminToolkitPage .at-b-keep { background: rgba(46,160,67,.25); }
        #AdminToolkitPage .at-b-remove { background: rgba(204,51,51,.22); }
        #AdminToolkitPage .at-b-high { background: rgba(46,160,67,.25); }
        #AdminToolkitPage .at-b-medium { background: rgba(230,160,20,.25); }
        #AdminToolkitPage .at-b-low { background: rgba(204,51,51,.22); }
        #AdminToolkitPage .at-b-info { background: rgba(0,164,220,.18); }
        #AdminToolkitPage .at-b-safe { background: rgba(46,160,67,.3); }
        #AdminToolkitPage .at-b-live { background: rgba(204,51,51,.3); }
        #AdminToolkitPage .at-warn { border-left: .3em solid rgba(230,160,20,.9); padding: .45em .8em; background: rgba(230,160,20,.12); margin: .4em 0; border-radius: .2em; }
        #AdminToolkitPage .at-ok { border-left: .3em solid rgba(46,160,67,.9); padding: .45em .8em; background: rgba(46,160,67,.12); margin: .4em 0; border-radius: .2em; }
        #AdminToolkitPage .at-error { border-left: .3em solid rgba(204,51,51,.95); padding: .6em .9em; background: rgba(204,51,51,.12); margin: .4em 0; border-radius: .2em; }
        #AdminToolkitPage .at-error .at-mono { display: block; margin-top: .2em; }
        #AdminToolkitPage .at-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        #AdminToolkitPage table.at-table { border-collapse: collapse; width: 100%; font-size: .9em; }
        #AdminToolkitPage .at-table th, #AdminToolkitPage .at-table td { text-align: left; padding: .4em .5em; border-bottom: 1px solid rgba(128,128,128,.25); vertical-align: top; }
        #AdminToolkitPage .at-table th { cursor: default; white-space: nowrap; }
        #AdminToolkitPage .at-table th[data-sort] { cursor: pointer; text-decoration: underline dotted; }
        #AdminToolkitPage .at-copies { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22em), 1fr)); gap: .7em; margin-top: .6em; }
        #AdminToolkitPage .at-copy { border: 2px solid rgba(128,128,128,.35); border-radius: .5em; padding: .6em .8em; min-width: 0; }
        #AdminToolkitPage .at-copy.keep { border-color: rgba(46,160,67,.8); }
        #AdminToolkitPage .at-copy.remove { border-color: rgba(204,51,51,.6); }
        #AdminToolkitPage .at-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .15em .7em; font-size: .88em; margin: .4em 0; }
        #AdminToolkitPage .at-kv > :nth-child(odd) { opacity: .7; }
        #AdminToolkitPage ul.at-list { margin: .3em 0; padding-left: 1.2em; }
        #AdminToolkitPage ul.at-list li { margin: .12em 0; }
        #AdminToolkitPage .at-group-head { display: flex; gap: .8em; align-items: flex-start; }
        #AdminToolkitPage .at-poster { width: 70px; height: 105px; object-fit: cover; border-radius: .3em; background: rgba(128,128,128,.2); flex: none; }
        #AdminToolkitPage .at-bar { height: .7em; border-radius: .35em; background: rgba(128,128,128,.25); overflow: hidden; margin: .3em 0; }
        #AdminToolkitPage .at-bar > div { height: 100%; background: rgba(0,164,220,.85); }
        #AdminToolkitPage .at-bar.at-full > div { background: rgba(204,51,51,.85); }
        #AdminToolkitPage .at-imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 11em), 1fr)); gap: .6em; }
        #AdminToolkitPage .at-imgcard { border: 1px solid rgba(128,128,128,.35); border-radius: .4em; padding: .4em; display: flex; flex-direction: column; gap: .3em; min-width: 0; font-size: .85em; }
        #AdminToolkitPage .at-imgbox { height: 9em; display: flex; align-items: center; justify-content: center; border-radius: .3em; overflow: hidden; }
        #AdminToolkitPage .at-imgbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #AdminToolkitPage .bg-dark .at-imgbox, #AdminToolkitPage .at-imgbox.bg-dark { background: #101010; }
        #AdminToolkitPage .bg-light .at-imgbox, #AdminToolkitPage .at-imgbox.bg-light { background: #f4f4f4; }
        #AdminToolkitPage .bg-check .at-imgbox, #AdminToolkitPage .at-imgbox.bg-check { background-color: #fff; background-image: linear-gradient(45deg, #c8c8c8 25%, transparent 25%), linear-gradient(-45deg, #c8c8c8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #c8c8c8 75%), linear-gradient(-45deg, transparent 75%, #c8c8c8 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
        #AdminToolkitPage .at-split { display: grid; grid-template-columns: minmax(0, 20em) minmax(0, 1fr); gap: 1em; }
        #AdminToolkitPage .at-pick { max-height: 32em; overflow-y: auto; border: 1px solid rgba(128,128,128,.3); border-radius: .4em; }
        #AdminToolkitPage .at-pick button { display: block; width: 100%; text-align: left; padding: .45em .6em; background: none; border: 0; border-bottom: 1px solid rgba(128,128,128,.2); color: inherit; font: inherit; cursor: pointer; min-height: 40px; }
        #AdminToolkitPage .at-pick button:hover, #AdminToolkitPage .at-pick button[aria-current="true"] { background: rgba(0,164,220,.18); }
        #AdminToolkitPage dialog.at-dialog { color: inherit; background: var(--at-dialog-bg, #202020); border: 1px solid rgba(128,128,128,.5); border-radius: .6em; padding: 1em 1.2em; width: min(56em, calc(100vw - 2em)); max-height: calc(100vh - 2em); overflow-y: auto; box-sizing: border-box; }
        #AdminToolkitPage dialog.at-dialog::backdrop { background: rgba(0,0,0,.55); }
        #AdminToolkitPage .at-progress { display: inline-block; min-width: 8em; }
        #AdminToolkitPage .at-pager { display: flex; gap: .4em; align-items: center; flex-wrap: wrap; margin: .6em 0; }
        #AdminToolkitPage details > summary { cursor: pointer; padding: .2em 0; }
        #AdminToolkitPage .at-cmd { display: flex; gap: .4em; align-items: flex-start; margin: .3em 0; }
        #AdminToolkitPage .at-cmd code { flex: 1; background: rgba(128,128,128,.18); padding: .35em .5em; border-radius: .3em; }
        #AdminToolkitPage a { color: rgb(0,164,220); }
        #AdminToolkitPage .at-hidden { display: none !important; }
        @media (max-width: 760px) {
            #AdminToolkitPage .at-split { grid-template-columns: minmax(0, 1fr); }
            #AdminToolkitPage .at-pick { max-height: 16em; }
            #AdminToolkitPage .at-tabs button { flex: 1 1 30%; padding: .4em .4em; }
            #AdminToolkitPage .at-card { padding: .6em .6em; }
        }
    </style>
    <div data-role="content">
        <div class="content-primary at-wrap">
            <h2>Admin Toolkit</h2>
            <div class="at-status" id="atStatus"><span class="at-muted">Loading status...</span></div>
            <div class="at-tabs" role="tablist" id="atTabs">
                <button type="button" role="tab" data-tab="duplicates" aria-selected="true">Duplicates</button>
                <button type="button" role="tab" data-tab="images" aria-selected="false">Images</button>
                <button type="button" role="tab" data-tab="health" aria-selected="false">Library Health</button>
                <button type="button" role="tab" data-tab="storage" aria-selected="false">Storage</button>
                <button type="button" role="tab" data-tab="activity" aria-selected="false">Activity Log</button>
                <button type="button" role="tab" data-tab="settings" aria-selected="false">Settings</button>
            </div>
            <div data-panel="duplicates" role="tabpanel"></div>
            <div data-panel="images" role="tabpanel" class="at-hidden"></div>
            <div data-panel="health" role="tabpanel" class="at-hidden"></div>
            <div data-panel="storage" role="tabpanel" class="at-hidden"></div>
            <div data-panel="activity" role="tabpanel" class="at-hidden"></div>
            <div data-panel="settings" role="tabpanel" class="at-hidden"></div>
            <dialog class="at-dialog" id="atDialog"></dialog>
        </div>
    </div>
    <script type="text/javascript">
    (function () {
        'use strict';
        var page = document.querySelector('#AdminToolkitPage');
        if (!page || page.getAttribute('data-at-init')) { return; }
        page.setAttribute('data-at-init', '1');

        var state = { status: null, tab: 'duplicates', loaded: {}, errors: [], dup: { page: 0, filter: '', kind: '', conf: '' }, img: { itemId: null, list: [], listIndex: -1, results: [], analysis: {}, bg: 'bg-check', type: 'Primary', blobs: [] }, health: { page: 0, cat: '', sev: '', text: '', selected: {} }, storage: { sort: 'bytes', dir: -1, kind: '', drive: '' }, settings: null, polling: {} };
        var PAGE_SIZE = 25;

        // ---------- helpers ----------
        function h(tag, props) {
            var el = document.createElement(tag);
            props = props || {};
            Object.keys(props).forEach(function (k) {
                var v = props[k];
                if (v === undefined || v === null || v === false) { return; }
                if (k === 'text') { el.textContent = v; }
                else if (k === 'className') { el.className = v; }
                else if (k === 'onclick' || k === 'onchange' || k === 'oninput' || k === 'onkeydown') { el.addEventListener(k.slice(2), v); }
                else if (k === 'style') { el.setAttribute('style', v); }
                else if (k in el && typeof v !== 'string') { el[k] = v; }
                else { el.setAttribute(k, v === true ? '' : String(v)); }
            });
            for (var i = 2; i < arguments.length; i++) { append(el, arguments[i]); }
            return el;
        }
        function append(el, c) {
            if (c === null || c === undefined || c === false) { return; }
            if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
            el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
        }
        function clear(el) { while (el.firstChild) { el.removeChild(el.firstChild); } return el; }
        function btn(text, onclick, cls, extra) { var p = Object.assign({ type: 'button', className: 'at-btn ' + (cls || ''), text: text, onclick: onclick }, extra || {}); return h('button', p); }
        function badge(text, cls) { return h('span', { className: 'at-badge ' + (cls || 'at-b-info'), text: text }); }
        function fmtBytes(b) {
            if (b === null || b === undefined || isNaN(b)) { return '?'; }
            var u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'], i = 0, n = Number(b);
            while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
            return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2)) + ' ' + u[i];
        }
        function fmtDate(s, withTime) {
            if (!s) { return '-'; }
            var d = new Date(s);
            if (isNaN(d.getTime()) || d.getFullYear() < 1900) { return '-'; }
            return withTime ? d.toLocaleString() : d.toLocaleDateString();
        }
        function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
        function safeStore(k, v) { try { if (v === undefined) { return localStorage.getItem(k); } localStorage.setItem(k, v); } catch (e) { return null; } return null; }
        function serverId() { try { return ApiClient.serverId(); } catch (e) { return ''; } }
        function detailsLink(id) { return '#/details?id=' + encodeURIComponent(id) + '&serverId=' + encodeURIComponent(serverId()); }
        function posterUrl(id, w) { return ApiClient.getUrl('Items/' + id + '/Images/Primary', { maxWidth: w || 140, quality: 80 }); }

        function ApiError(status, endpoint, message, code, body) {
            this.status = status; this.endpoint = endpoint; this.message = message; this.code = code; this.body = body;
        }
        ApiError.prototype = Object.create(Error.prototype);

        function headers(json) {
            var hd = { 'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"', 'Accept': json ? 'application/json' : '*/*' };
            if (json) { hd['Content-Type'] = 'application/json'; }
            return hd;
        }
        function api(method, path, body, raw) {
            var endpoint = method + ' /AdminToolkit/' + path;
            var url = ApiClient.getUrl('AdminToolkit/' + path);
            return fetch(url, { method: method, headers: headers(!raw), body: body === undefined ? undefined : JSON.stringify(body), cache: 'no-store' })
                .catch(function (e) { throw new ApiError(0, endpoint, 'Network error: ' + (e && e.message ? e.message : e) + ' (is the server reachable?)', 'network'); })
                .then(function (res) {
                    if (raw && res.ok) { return res; }
                    return res.text().then(function (text) {
                        var data = null;
                        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
                        if (!res.ok) {
                            var msg = data && data.message ? data.message : (text ? text.slice(0, 300) : res.statusText || 'No details returned');
                            if (res.status === 401 || res.status === 403) { if (!(data && data.message)) { msg = 'Not allowed (HTTP ' + res.status + '). Admin Toolkit needs an administrator account; sign in again if your session expired.'; } }
                            if (res.status === 404 && !data) { msg = 'Endpoint not found (HTTP 404). Is the Admin Toolkit plugin installed and Jellyfin restarted?'; }
                            var err = new ApiError(res.status, (data && data.endpoint) || endpoint, msg, data && data.error, text);
                            remember(err);
                            throw err;
                        }
                        return data;
                    });
                });
        }
        function remember(err) {
            state.errors.unshift({ time: new Date().toISOString(), status: err.status, endpoint: err.endpoint, code: err.code, message: err.message });
            state.errors = state.errors.slice(0, 20);
        }
        function diagnostics(err) {
            var s = state.status || {};
            return JSON.stringify({ plugin: 'Admin Toolkit', pluginVersion: s.pluginVersion, builtForJellyfin: s.builtForJellyfin, serverAssemblies: s.serverAssemblies,
                safeMode: s.safeMode, time: new Date().toISOString(), page: location.href.replace(/api_key=[^&]+/, 'api_key=***'), userAgent: navigator.userAgent,
                error: err ? { status: err.status, endpoint: err.endpoint, code: err.code, message: err.message } : null, recentErrors: state.errors }, null, 2);
        }
        function copyText(text, button) {
            function done(ok) { if (button) { var o = button.textContent; button.textContent = ok ? 'Copied' : 'Copy failed: select and copy manually'; setTimeout(function () { button.textContent = o; }, 2000); } }
            if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); }); }
            else { fallback(); }
            function fallback() {
                var ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0' }); ta.value = text; document.body.appendChild(ta); ta.select();
                var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                document.body.removeChild(ta); done(ok);
            }
        }
        function errorBox(err, retry) {
            var e = err instanceof ApiError ? err : new ApiError(0, '(page script)', String(err && err.message ? err.message : err), 'script');
            if (!(err instanceof ApiError)) { remember(e); }
            var copyBtn = btn('Copy diagnostics', function () { copyText(diagnostics(e), copyBtn); }, 'at-small');
            return h('div', { className: 'at-error', role: 'alert' },
                h('strong', { text: e.message }),
                h('span', { className: 'at-mono', text: (e.status ? 'HTTP ' + e.status + ' ' : '') + e.endpoint + (e.code ? ' (' + e.code + ')' : '') }),
                h('div', { className: 'at-row' }, retry ? btn('Retry', retry, 'at-small') : null, copyBtn));
        }
        // Loads one section independently: a failure shows its own error and never blanks other sections.
        function section(container, title, loader) {
            var body = h('div', {}, h('span', { className: 'at-muted', text: 'Loading...' }));
            var card = h('div', { className: 'at-card' }, title ? h('h3', { text: title }) : null, body);
            container.appendChild(card);
            function run() {
                clear(body).appendChild(h('span', { className: 'at-muted', text: 'Loading...' }));
                return Promise.resolve().then(function () { return loader(body); }).then(function (r) { return r; }, function (err) { clear(body).appendChild(errorBox(err, run)); throw err; });
            }
            return run();
        }
        function loadAll(tasks) { return Promise.allSettled(tasks); }
        function downloadFile(path, fallbackName) {
            return api('GET', path, undefined, true).then(function (res) {
                var cd = res.headers.get('Content-Disposition') || '';
                var m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
                return res.blob().then(function (blob) {
                    var a = h('a', { href: URL.createObjectURL(blob), download: m ? decodeURIComponent(m[1]) : fallbackName });
                    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
                });
            });
        }
        function safeMode() { return !state.status || state.status.safeMode !== false; }
        function safeNote() { return safeMode() ? h('div', { className: 'at-ok', text: 'Safe mode is on: you can scan, view, preview and export, and every change is refused. Turn it off in Settings to make changes.' }) : null; }

        // ---------- dialog ----------
        var dialog = page.querySelector('#atDialog');
        function openDialog(title, content, buttons) {
            clear(dialog);
            try { var bg = getComputedStyle(document.body).backgroundColor; if (bg && bg !== 'rgba(0, 0, 0, 0)') { dialog.style.setProperty('--at-dialog-bg', bg); } } catch (e) { /* default colour */ }
            dialog.appendChild(h('h3', { text: title }));
            append(dialog, content);
            var row = h('div', { className: 'at-row', style: 'justify-content:flex-end;margin-top:1em' });
            (buttons || []).forEach(function (b) { row.appendChild(b); });
            row.appendChild(btn('Close', closeDialog));
            dialog.appendChild(row);
            if (typeof dialog.showModal === 'function') { if (!dialog.open) { dialog.showModal(); } } else { dialog.setAttribute('open', ''); }
        }
        function closeDialog() { if (typeof dialog.close === 'function' && dialog.open) { dialog.close(); } else { dialog.removeAttribute('open'); } }

        // ---------- status bar ----------
        function loadStatus() {
            var el = page.querySelector('#atStatus');
            return api('GET', 'Status').then(function (s) {
                state.status = s;
                clear(el);
                el.appendChild(badge(s.safeMode ? 'Safe mode ON (view only)' : 'Safe mode OFF (changes allowed)', s.safeMode ? 'at-b-safe' : 'at-b-live'));
                el.appendChild(badge(s.dryRunDefault ? 'Dry run by default' : 'Dry run off by default', 'at-b-info'));
                el.appendChild(h('span', { className: 'at-muted', text: 'v' + s.pluginVersion + ' for Jellyfin ' + s.builtForJellyfin + ' (server assemblies ' + s.serverAssemblies + ') \u00b7 runs as ' + s.processUser }));
                if (s.serverAssemblies && s.serverAssemblies.indexOf(s.builtForJellyfin) !== 0) {
                    el.appendChild(h('div', { className: 'at-warn', text: 'This build was made for Jellyfin ' + s.builtForJellyfin + ' but the server reports ' + s.serverAssemblies + '. Some features may fail; install the matching Admin Toolkit release.' }));
                }
                return s;
            }, function (err) { clear(el).appendChild(errorBox(err, loadStatus)); throw err; });
        }

        // ---------- scans ----------
        function scanButton(kind, scanState, label, onDone) {
            var wrap = h('span', { className: 'at-row' });
            function render(st) {
                clear(wrap);
                if (st && st.running) {
                    wrap.appendChild(h('span', { className: 'at-progress' }, h('div', { className: 'at-bar' }, h('div', { style: 'width:' + (st.progress || 0) + '%' })), h('span', { className: 'at-muted', text: label + ' running: ' + (st.progress || 0) + '%' })));
                    wrap.appendChild(btn('Cancel', function () { api('POST', 'Scans/' + kind + '/Cancel', {}); }, 'at-small'));

                    api('POST', 'Settings/TestImageSearch', { provider: f.provider.value, apiKey: f.searchKey.value, engineId: f.engineId.value }).then(function (r) { clear(sOut).appendChild(h('div', { className: 'at-ok', text: r.provider + ': ' + r.count + ' results for "' + r.query + '".' })); }, function (e) { clear(sOut).appendChild(errorBox(e)); });
                }, 'at-small')), sOut));

            var drives = rowsEditor(s.driveMappings || [], [['prefix', 'Path prefix (as Jellyfin sees it)', '/data/media8tb1'], ['label', 'Drive name', '8TB 1']], function (row, get) {
                var out = h('span', {});
                return [btn('Check write access', function () { writeTest(get('prefix'), false, out); }, 'at-small'), btn('Test write (temp file)', function () { writeTest(get('prefix'), true, out); }, 'at-small'), out];
            });
            f.drives = drives;
            f.preferred = text(s.preferredDrive); f.preferred.placeholder = 'e.g. 8TB 2 (empty = off)';
            f.container = text(s.containerName);
            body.appendChild(h('div', { className: 'at-card' }, h('h3', { text: 'Drives' }),
                h('p', { className: 'at-muted', text: 'Name your drives by path prefix; the longest matching prefix wins. Used for drive labels, free space and the optional preferred-drive score. "Check write access" writes nothing; "Test write" creates and deletes an empty hidden file. Saved paths only.' }),
                drives.el, h('div', { className: 'at-form' }, field('Preferred drive (adds the "preferred drive" points)', f.preferred), field('Docker container name (for copy-ready commands)', f.container))));

            var w = s.weights || {};
            var wf = {};
            var wGrid = h('div', { className: 'at-form' });
            [['managedPath', 'Path managed by Sonarr/Radarr'], ['completeness', 'Completeness (episodes)'], ['onDisk', 'Files exist on disk'], ['quality', 'Quality (resolution)'], ['metadata', 'Metadata (ids, images, overview)'], ['watchHistory', 'Watch history'], ['dateAdded', 'Date added'], ['preferredDrive', 'Preferred drive'], ['highConfidenceGap', 'High confidence: minimum point gap'], ['mediumConfidenceGap', 'Medium confidence: minimum point gap (below = Low, never auto-selected)']].forEach(function (p) {
                wf[p[0]] = num(w[p[0]]);
                wGrid.appendChild(field(p[1] + ' (default ' + defaults[p[0]] + ')', wf[p[0]]));
            });
            var older = check('Older copy gets the date-added points (untick: newer copy)', w.preferOlder);
            var epDup = check('Also look for duplicate episodes inside one series', s.scanEpisodeDuplicates, 'Slower on large libraries.');
            body.appendChild(h('div', { className: 'at-card' }, h('h3', { text: 'Duplicate scoring' }), wGrid, older.el, epDup.el,
                h('div', { className: 'at-row' }, btn('Reset weights to defaults', function () { api('POST', 'Settings/ResetWeights', {}).then(function () { showTab('settings', true); }, function (e) { body.appendChild(errorBox(e)); }); }, 'at-small')),
                h('p', { className: 'at-muted', text: 'Free space on a drive is never a factor. Rescan duplicates after changing weights.' })));

            var sched = check('Allow scheduled scans', s.scheduledScansEnabled, 'The task "Admin Toolkit: scan duplicates and library health" has no trigger by default. Tick this AND add a trigger in Dashboard > Scheduled Tasks. It only scans; it never changes anything.');
            f.retention = num(s.activityRetentionDays); f.subLang = text(s.auditSubtitleLanguage); f.audioLang = text(s.auditAudioLanguage); f.bitrate = num(s.highBitrateMbps); f.months = num(s.notWatchedMonths);
            body.appendChild(h('div', { className: 'at-card' }, h('h3', { text: 'Scans, audits and log' }), sched.el,
                h('div', { className: 'at-form' }, field('Activity log retention (days)', f.retention), field('Subtitle audit language (ISO 639-2, e.g. eng)', f.subLang), field('Audio audit language', f.audioLang), field('High bitrate warning (Mbps)', f.bitrate), field('"Not watched" period (months)', f.months))));

            var out = h('div', {});
            var saveBtn = btn('Save settings', function () {
                var cfg = Object.assign({}, s, {
                    safeMode: safe.input.checked, dryRunDefault: dry.input.checked, confirmationLevel: f.confirmationLevel.value,
                    sonarrUrl: f.sonarrUrl.value, sonarrApiKey: f.sonarrKey.value, radarrUrl: f.radarrUrl.value, radarrApiKey: f.radarrKey.value, jellyseerrUrl: f.jellyseerrUrl.value, jellyseerrApiKey: f.jellyseerrKey.value,
                    arrPathMappings: f.arrMaps.value(), imageSearchProvider: f.provider.value, imageSearchApiKey: f.searchKey.value, googleSearchEngineId: f.engineId.value,
                    driveMappings: f.drives.value(), preferredDrive: f.preferred.value, containerName: f.container.value, scanEpisodeDuplicates: epDup.input.checked, scheduledScansEnabled: sched.input.checked,
                    activityRetentionDays: Number(f.retention.value), auditSubtitleLanguage: f.subLang.value, auditAudioLanguage: f.audioLang.value, highBitrateMbps: Number(f.bitrate.value), notWatchedMonths: Number(f.months.value),
                    weights: Object.assign({}, w, { preferOlder: older.input.checked })
                });
                Object.keys(wf).forEach(function (k) { cfg.weights[k] = Number(wf[k].value); });
                saveBtn.disabled = true;
                api('POST', 'Settings', cfg).then(function () {
                    clear(out).appendChild(h('div', { className: 'at-ok', text: 'Saved.' }));
                    state.loaded = { settings: true };
                    loadStatus().then(function () { setTimeout(function () { showTab('settings', true); }, 600); });
                }, function (e) { clear(out).appendChild(errorBox(e)); }).then(function () { saveBtn.disabled = false; });
            }, 'at-primary');
            body.appendChild(h('div', { className: 'at-card' }, h('div', { className: 'at-row' }, saveBtn), out,
                h('p', { className: 'at-muted', text: 'Uninstalling Admin Toolkit removes its cache and activity log (' + (state.status ? state.status.dataDirectory : '<data>/admintoolkit') + '). It never writes into other plugins or the home screen, so nothing else needs cleaning up.' })));
        }

        function writeTest(path, probe, out) {
            clear(out).appendChild(h('span', { className: 'at-muted', text: 'Checking...' }));
            api('POST', 'Settings/TestWrite', { path: path, probe: probe }).then(function (r) { clear(out).appendChild(h('span', { className: r.ok ? 'at-ok' : 'at-error', text: r.message })); }, function (e) { clear(out).appendChild(errorBox(e)); });
        }

        function rowsEditor(rows, cols, extra) {
            var el = h('div', {});
            var list = h('div', {});
            el.appendChild(list);
            var items = [];
            function addRow(r) {
                var inputs = {};
                var row = h('div', { className: 'at-row' });
                cols.forEach(function (c) { inputs[c[0]] = h('input', { type: 'text', value: r[c[0]] || '', placeholder: c[2], title: c[1], style: 'flex:1;min-width:11em' }); row.appendChild(inputs[c[0]]); });
                var item = { inputs: inputs };
                if (extra) { append(row, extra(row, function (k) { return inputs[k].value; })); }
                row.appendChild(btn('Remove', function () { items.splice(items.indexOf(item), 1); row.remove(); }, 'at-small'));
                items.push(item);
                list.appendChild(row);
            }
            rows.forEach(addRow);
            el.appendChild(h('div', { className: 'at-muted', text: cols.map(function (c) { return c[1]; }).join(' \u2192 ') }));
            el.appendChild(btn('Add row', function () { addRow({}); }, 'at-small'));
            return { el: el, value: function () { return items.map(function (it) { var o = {}; cols.forEach(function (c) { o[c[0]] = it.inputs[c[0]].value.trim(); }); return o; }).filter(function (o) { return cols.every(function (c) { return o[c[0]]; }); }); } };
        }

        // ---------- start ----------
        function start() {
            if (state.startedAt && Date.now() - state.startedAt < 1500) { return; }
            state.startedAt = Date.now();
            var saved = safeStore('adminToolkit.tab');
            loadStatus().catch(function () { /* the status bar shows the error; tabs still load */ }).then(function () {
                showTab(saved && loaders[saved] ? saved : 'duplicates', true);
            });
        }
        page.addEventListener('pageshow', start);
        page.addEventListener('viewshow', start);
        setTimeout(function () { if (!state.startedAt && document.body.contains(page)) { start(); } }, 0);
    })();
    </script>
</div>
</body>
</html>
