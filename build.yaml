version: "1.0.0.0"
targetAbi: "10.11.10.0"
framework: "net9.0"
overview: "Admin-only dashboard toolkit: duplicates, artwork, library health and storage."
description: >
  A Dashboard page for administrators with tabs for finding and resolving duplicate movies and shows (with a transparent
  keep/remove score and Sonarr/Radarr-aware removal), editing artwork with Jellyfin's providers or web image search
  (with real transparency detection), library health checks, storage insight per drive, and an activity log.
  Read-only by default: safe mode is on for a new install and every destructive action needs a preview and confirmation.
  No home-screen footprint and no changes to other plugins.
